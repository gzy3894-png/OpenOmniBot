# Secondary development gate: nine parallel executions from one source commit.
name: Baseline Standard Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "secondary/**"
    paths:
      - "app/**"
      - "ui/**"
      - "baselib/**"
      - "assists/**"
      - "accessibility/**"
      - "omniintelligence/**"
      - "uikit/**"
      - "ReTerminal/**"
      - "gradle/**"
      - "*.gradle*"
      - "gradle.properties"
      - "lint.xml"
      - "docs/results/reports/scout-b20-perm.md"
      - "docs/results/reports/impl-b25-perm.md"
      - ".github/workflows/baseline-standard-debug.yml"

permissions:
  contents: read

concurrency:
  group: baseline-standard-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.38.7"
  NDK_VERSION: "28.2.13676358"
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: "ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04"

jobs:
  source-policy:
    name: Source policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify source policy and write manifest
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          [[ "$source_commit" == "$GITHUB_SHA" ]] ||
            { echo "::error::Checkout HEAD does not match GITHUB_SHA" >&2; exit 1; }
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]] ||
            { echo "::error::Checkout worktree is not clean" >&2; git status --short >&2; exit 1; }

          required_files=(
            "lint.xml"
            "app/build.gradle.kts"
            "app/src/main/res/values/strings.xml"
            "app/src/main/res/values-en/strings.xml"
            "docs/results/reports/scout-b20-perm.md"
            "docs/results/reports/impl-b25-perm.md"
          )
          for path in "${required_files[@]}"; do
            git ls-files --error-unmatch -- "$path" >/dev/null ||
              { echo "::error::Required tracked file is missing: $path" >&2; exit 1; }
          done

          for module in assists accessibility; do
            [[ -d "$module" ]] ||
              { echo "::error::Required source directory is missing: $module/" >&2; exit 1; }
            mapfile -d '' -t tracked_files < <(git ls-files -z -- "$module/")
            [[ ${#tracked_files[@]} -gt 0 ]] ||
              { echo "::error::No tracked files found under $module/" >&2; exit 1; }
          done

          mapfile -t application_ids < <(
            sed -nE 's/^[[:space:]]*applicationId[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' \
              app/build.gradle.kts
          )
          [[ ${#application_ids[@]} -eq 1 ]] ||
            { echo "::error::Expected exactly one applicationId assignment" >&2; exit 1; }
          [[ "${application_ids[0]}" == "cn.com.omnimind.bot" ]] ||
            { echo "::error::applicationId drifted to ${application_ids[0]}" >&2; exit 1; }

          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              Path("app/src/main/res/values/strings.xml"): {
                  "app_name": r"\u5c0f\u4e07",
                  "omni_app_name": r"\u5c0f\u4e07",
              },
              Path("app/src/main/res/values-en/strings.xml"): {
                  "app_name": "Omnibot",
                  "omni_app_name": "Omnibot",
              },
          }
          for path, names in expected.items():
              values = {
                  element.attrib.get("name"): element.text
                  for element in ET.parse(path).getroot().findall("string")
              }
              for name, wanted in names.items():
                  actual = values.get(name)
                  if actual != wanted:
                      raise SystemExit(
                          f"::error::{path}:{name} brand drift: expected {wanted!r}, got {actual!r}"
                      )
          PY

          manifest="${RUNNER_TEMP}/SOURCE-POLICY-MANIFEST.txt"
          {
            printf 'SOURCE_COMMIT=%s\n' "$source_commit"
            printf 'SOURCE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'APPLICATION_ID=%s\n' "${application_ids[0]}"
            printf 'BRAND_DEFAULT=%s\n' '\u5c0f\u4e07'
            printf 'BRAND_ENGLISH=%s\n' 'Omnibot'
            for path in "${required_files[@]}"; do
              printf 'TRACKED_FILE=%s\t%s\n' "$(git rev-parse "HEAD:$path")" "$path"
            done
            for module in assists accessibility; do
              printf 'TRACKED_TREE=%s\t%s/\n' "$(git rev-parse "HEAD:$module")" "$module"
            done
          } | tee "$manifest"

          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

      - name: Upload source policy manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-policy-manifest
          path: ${{ runner.temp }}/SOURCE-POLICY-MANIFEST.txt
          if-no-files-found: warn
          retention-days: 14

  flutter-tests:
    name: Flutter tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Verify partition and run shard
        working-directory: ui
        shell: bash
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "4"
        run: |
          set -euo pipefail
          mapfile -d '' -t tests < <(find test -type f -name '*_test.dart' -print0 | LC_ALL=C sort -z)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "::error::No Flutter tests discovered under ui/test" >&2
            exit 1
          fi

          partition=()
          selected=()
          for ((shard=0; shard<SHARD_COUNT; shard++)); do
            for ((index=0; index<${#tests[@]}; index++)); do
              if (( index % SHARD_COUNT == shard )); then
                partition+=("${tests[index]}")
                if (( shard == SHARD_INDEX )); then
                  selected+=("${tests[index]}")
                fi
              fi
            done
          done
          mapfile -t sorted_partition < <(printf '%s\n' "${partition[@]}" | LC_ALL=C sort)
          for ((index=0; index<${#tests[@]}; index++)); do
            if [[ "${tests[index]}" != "${sorted_partition[index]:-}" ]]; then
              echo "::error::Flutter test partition has an omission or duplicate" >&2
              exit 1
            fi
          done
          if [[ ${#partition[@]} -ne ${#tests[@]} || ${#selected[@]} -eq 0 ]]; then
            echo "::error::Invalid Flutter test shard cardinality" >&2
            exit 1
          fi

          manifest="${RUNNER_TEMP}/flutter-test-shard-${SHARD_INDEX}.txt"
          {
            echo "source_commit=${GITHUB_SHA}"
            echo "shard=${SHARD_INDEX}/${SHARD_COUNT}"
            echo "total_tests=${#tests[@]}"
            echo "selected_tests=${#selected[@]}"
            printf '%s\n' "${selected[@]}"
          } | tee "$manifest"
          # Keep the four matrix shards parallel, but serialize suites inside
          # each shard to avoid cross-suite global view/locale/channel/singleton state interference.
          flutter test --concurrency=1 "${selected[@]}"

      - name: Upload shard manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-shard-${{ matrix.shard }}-manifest
          path: ${{ runner.temp }}/flutter-test-shard-${{ matrix.shard }}.txt
          if-no-files-found: warn
          retention-days: 14

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Analyze all Flutter sources
        working-directory: ui
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-warnings --no-fatal-infos

  android-gates:
    name: Android ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - gate: unit
            gradle_task: ":app:testDevelopStandardDebugUnitTest"
          - gate: lint
            gradle_task: ":app:lintDevelopStandardDebug"
          - gate: apk
            gradle_task: ":app:assembleDevelopStandardDebug"
    env:
      GRADLE_OPTS: "-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Verify source commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-${{ hashFiles('ui/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-${{ env.FLUTTER_VERSION }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # `yes` normally exits on SIGPIPE after sdkmanager accepts all
          # licenses. Judge this pipeline by sdkmanager (the last command).
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Materialize fixed debug keystore
        if: matrix.gate == 'apk'
        shell: bash
        env:
          AWB_DEBUG_KEYSTORE_BASE64: ${{ secrets.AWB_DEBUG_KEYSTORE_BASE64 }}
          AWB_DEBUG_STORE_PASSWORD: ${{ secrets.AWB_DEBUG_STORE_PASSWORD }}
          AWB_DEBUG_KEY_ALIAS: ${{ secrets.AWB_DEBUG_KEY_ALIAS }}
          AWB_DEBUG_KEY_PASSWORD: ${{ secrets.AWB_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in AWB_DEBUG_KEYSTORE_BASE64 AWB_DEBUG_STORE_PASSWORD AWB_DEBUG_KEY_ALIAS AWB_DEBUG_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing fixed debug signing value: $name" >&2
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/omnibot-debug.jks"
          printf '%s' "$AWB_DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          echo "AWB_DEBUG_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Run Android unit or lint gate
        if: matrix.gate != 'apk'
        run: >-
          ./gradlew --no-daemon --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          ${{ matrix.gradle_task }}
          -Ptarget=lib/main_standard.dart

      - name: Assemble signed standard APK
        if: matrix.gate == 'apk'
        env:
          AWB_DEBUG_STORE_PASSWORD: ${{ secrets.AWB_DEBUG_STORE_PASSWORD }}
          AWB_DEBUG_KEY_ALIAS: ${{ secrets.AWB_DEBUG_KEY_ALIAS }}
          AWB_DEBUG_KEY_PASSWORD: ${{ secrets.AWB_DEBUG_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          ${{ matrix.gradle_task }}
          -Ptarget=lib/main_standard.dart

      - name: Collect APK, hashes, certificate and commit manifest
        if: matrix.gate == 'apk'
        shell: bash
        env:
          EXPECTED_CERT_SHA256: "6D79D352E68FC7E1956FE14C41B6AFFAD2A1403EB22AF9E76B4E213FA10244C6"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/omnibot-baseline-apk"
          mkdir -p "$out"
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          [[ ${#apks[@]} -gt 0 ]] || { echo "::error::No APK produced" >&2; exit 1; }
          primary="$(printf '%s\n' "${apks[@]}" | grep -m1 'standard' || printf '%s\n' "${apks[@]}" | head -1)"
          cp "$primary" "$out/OpenOmniBot-standard-debug.apk"
          apk_sha="$(sha256sum "$out/OpenOmniBot-standard-debug.apk" | awk '{print toupper($1)}')"
          apksigner_bin="$(command -v apksigner || find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [[ -n "$apksigner_bin" ]] || { echo "::error::apksigner not found" >&2; exit 1; }
          if ! verify_output="$("$apksigner_bin" verify --print-certs \
            "$out/OpenOmniBot-standard-debug.apk" 2>&1)"; then
            echo "::error::APK signature verification failed (tool: $apksigner_bin; output bytes: ${#verify_output})" >&2
            exit 1
          fi
          mapfile -t cert_raw_values < <(printf '%s\n' "$verify_output" | awk '
            tolower($0) ~ /^[[:space:]]*signer[[:space:]]*#[[:space:]]*[0-9]+[[:space:]]+certificate[[:space:]]+sha-?256[[:space:]]+digest[[:space:]]*:/ {
              line = $0
              sub(/^[^:]*:[[:space:]]*/, "", line)
              print line
            }
          ')
          [[ ${#cert_raw_values[@]} -eq 1 ]] ||
            { echo "::error::Expected exactly one APK signer certificate, found ${#cert_raw_values[@]} (tool: $apksigner_bin; output bytes: ${#verify_output})" >&2; exit 1; }
          cert_sha="$(printf '%s' "${cert_raw_values[0]}" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')"
          [[ "$cert_sha" =~ ^[0-9A-F]{64}$ ]] ||
            { echo "::error::Could not parse a 64-hex APK certificate SHA-256 digest (tool: $apksigner_bin; output bytes: ${#verify_output})" >&2; exit 1; }
          [[ "$cert_sha" == "$EXPECTED_CERT_SHA256" ]] ||
            { echo "::error::Unexpected APK certificate fingerprint" >&2; exit 1; }
          (cd "$out" && sha256sum *.apk > SHA256SUMS)
          {
            echo "SOURCE_COMMIT=$GITHUB_SHA"
            echo "SOURCE_REF=$GITHUB_REF"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
            echo "BUILD_VARIANT=developStandardDebug"
            echo "FLUTTER_TARGET=lib/main_standard.dart"
            echo "APK_SHA256=$apk_sha"
            echo "CERT_SHA256=$cert_sha"
            echo "EXPECTED_CERT_SHA256=$EXPECTED_CERT_SHA256"
          } | tee "$out/BUILD-MANIFEST.txt"

      - name: Upload Android reports
        if: always() && matrix.gate != 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.gate }}-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed APK artifact
        if: matrix.gate == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: omnibot-standard-debug-apk
          path: |
            ${{ runner.temp }}/omnibot-baseline-apk/OpenOmniBot-standard-debug.apk
            ${{ runner.temp }}/omnibot-baseline-apk/SHA256SUMS
            ${{ runner.temp }}/omnibot-baseline-apk/BUILD-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14

  gate-summary:
    name: Nine-way gate summary
    if: always()
    needs:
      - source-policy
      - flutter-tests
      - flutter-analyze
      - android-gates
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel gate
        env:
          SOURCE_POLICY_RESULT: ${{ needs.source-policy.result }}
          FLUTTER_TESTS_RESULT: ${{ needs.flutter-tests.result }}
          FLUTTER_ANALYZE_RESULT: ${{ needs.flutter-analyze.result }}
          ANDROID_GATES_RESULT: ${{ needs.android-gates.result }}
        run: |
          set -euo pipefail
          printf 'source-policy=%s\nflutter-tests=%s\nflutter-analyze=%s\nandroid-gates=%s\n' \
            "$SOURCE_POLICY_RESULT" "$FLUTTER_TESTS_RESULT" \
            "$FLUTTER_ANALYZE_RESULT" "$ANDROID_GATES_RESULT"
          [[ "$SOURCE_POLICY_RESULT" == success ]]
          [[ "$FLUTTER_TESTS_RESULT" == success ]]
          [[ "$FLUTTER_ANALYZE_RESULT" == success ]]
          [[ "$ANDROID_GATES_RESULT" == success ]]
