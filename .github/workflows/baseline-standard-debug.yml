# Secondary-dev: standard debug APK with FIXED debug signing (upgrade-install safe).
# Secrets: AWB_DEBUG_KEYSTORE_BASE64, AWB_DEBUG_STORE_PASSWORD, AWB_DEBUG_KEY_ALIAS, AWB_DEBUG_KEY_PASSWORD

name: Baseline Standard Debug

on:
  workflow_dispatch:
  push:
    branches:
      - "secondary/**"
    paths:
      - "app/**"
      - "ui/**"
      - "baselib/**"
      - "assists/**"
      - "accessibility/**"
      - "omniintelligence/**"
      - "uikit/**"
      - "ReTerminal/**"
      - "gradle/**"
      - "*.gradle*"
      - "gradle.properties"
      - ".github/workflows/baseline-standard-debug.yml"

permissions:
  contents: read

concurrency:
  group: baseline-standard-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "3.38.7"
  NDK_VERSION: "28.2.13676358"
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: "ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04"
  AWB_DEBUG_KEYSTORE_BASE64: ${{ secrets.AWB_DEBUG_KEYSTORE_BASE64 }}
  AWB_DEBUG_STORE_PASSWORD: ${{ secrets.AWB_DEBUG_STORE_PASSWORD }}
  AWB_DEBUG_KEY_ALIAS: ${{ secrets.AWB_DEBUG_KEY_ALIAS }}
  AWB_DEBUG_KEY_PASSWORD: ${{ secrets.AWB_DEBUG_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Materialize fixed debug keystore
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for v in AWB_DEBUG_KEYSTORE_BASE64 AWB_DEBUG_STORE_PASSWORD AWB_DEBUG_KEY_ALIAS AWB_DEBUG_KEY_PASSWORD; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::Missing secret/env: $v" >&2
              missing=1
            else
              echo "OK: $v is set (redacted)"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Fixed debug signing required for secondary-dev baseline APKs." >&2
            exit 1
          fi
          ks="${RUNNER_TEMP}/omnibot-debug.jks"
          printf '%s' "${AWB_DEBUG_KEYSTORE_BASE64}" | base64 -d > "$ks"
          test -s "$ks"
          echo "AWB_DEBUG_KEYSTORE_FILE=$ks" >> "$GITHUB_ENV"
          if command -v keytool >/dev/null 2>&1; then
            keytool -list -v -keystore "$ks" -storepass "${AWB_DEBUG_STORE_PASSWORD}" 2>/dev/null \
              | grep -E 'Alias name:|SHA256:' || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android NDK
        id: cache-android-ndk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: ${{ runner.os }}-android-ndk-${{ env.NDK_VERSION }}

      - name: Install Android NDK
        if: steps.cache-android-ndk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: Export Android NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Flutter pub get
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Assemble develop standard debug (stable signing)
        env:
          AWB_DEBUG_KEYSTORE_FILE: ${{ env.AWB_DEBUG_KEYSTORE_FILE }}
          AWB_DEBUG_STORE_PASSWORD: ${{ env.AWB_DEBUG_STORE_PASSWORD }}
          AWB_DEBUG_KEY_ALIAS: ${{ env.AWB_DEBUG_KEY_ALIAS }}
          AWB_DEBUG_KEY_PASSWORD: ${{ env.AWB_DEBUG_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --parallel --build-cache
          :app:assembleDevelopStandardDebug
          -Ptarget=lib/main_standard.dart

      - name: Collect APK + SHA256
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/omnibot-baseline-apk"
          mkdir -p "$out"
          mapfile -t apks < <(find app/build/outputs/apk -type f -name "*.apk" | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APK under app/build/outputs/apk" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp -f "$apk" "$out/"
          done
          (
            cd "$out"
            sha256sum *.apk | tee SHA256SUMS
            ls -la
          )
          primary="$(ls -1 "$out"/*standard*.apk 2>/dev/null | head -1 || ls -1 "$out"/*.apk | head -1)"
          cp -f "$primary" "$out/OpenOmniBot-standard-debug.apk"
          sha256sum "$out/OpenOmniBot-standard-debug.apk" | tee -a "$out/SHA256SUMS"
          # Expected cert fingerprint (Agent Workbench internal debug)
          echo "EXPECTED_CERT_SHA256=6D79D352E68FC7E1956FE14C41B6AFFAD2A1403EB22AF9E76B4E213FA10244C6"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibot-standard-debug-apk
          path: |
            /tmp/omnibot-baseline-apk/*.apk
            /tmp/omnibot-baseline-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
